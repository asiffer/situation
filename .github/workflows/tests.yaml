name: tests

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...
